# app.yaml
name: ai-medical-content-generator
region: nyc

services:
  - name: web
    http_port: 8080
    github:
      repo: zainal89/ai-medical-content-generator
      branch: main
    run_command: python main.py
    environment_slug: python
    instance_size_slug: basic-xs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 300  # Increased from 180 to 300
      period_seconds: 15         # Increased from 10 to 15
      timeout_seconds: 15        # Increased from 10 to 15
      failure_threshold: 5       # Increased from 3 to 5
      success_threshold: 2       # Added success threshold
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}
      - key: PERPLEXITY_API_KEY
        scope: RUN_TIME
        value: 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
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        value: ${FIRECRAWL_API_KEY}
      - key: MONGO_URI
        scope: RUN_TIME
        value: ${MONGO_URI}
      - key: PORT    # Explicitly set PORT environment variable
        scope: RUN_TIME
        value: "8080"

workers:
  - name: scheduler
    github:
      repo: zainal89/ai-medical-content-generator
      branch: main
    run_command: python worker.py
    environment_slug: python
    instance_size_slug: basic-xs
    instance_count: 1
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        value: ${FIRECRAWL_API_KEY}
      - key: MONGO_URI
        scope: RUN_TIME
        value: ${MONGO_URI}
