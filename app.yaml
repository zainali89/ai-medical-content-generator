# app.yaml
name: ai-medical-content-generator
region: nyc

services:
  - name: web
    github:
      repo: zainal89/ai-medical-content-generator
      branch: main
    run_command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:fastapi_app --bind 0.0.0.0:8000
    environment_slug: python
    instance_size_slug: basic-xs
    http_port: 8000
    health_check:
      http_path: /health
      initial_delay_seconds: 120  # Increased from 60 to 120
      period_seconds: 15
      timeout_seconds: 8
      failure_threshold: 5
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}
      - key: PERPLEXITY_API_KEY
        scope: RUN_TIME
        value: ${PERPLEXITY_API_KEY}
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        value: ${FIRECRAWL_API_KEY}
      - key: MONGO_URI
        scope: RUN_TIME
        value: ${MONGO_URI}

workers:
  - name: scheduler
    github:
      repo: zainal89/ai-medical-content-generator
      branch: main
    run_command: python worker.py
    environment_slug: python
    instance_size_slug: basic-xs
    instance_count: 1
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        value: ${FIRECRAWL_API_KEY}
      - key: MONGO_URI
        scope: RUN_TIME
        value: ${MONGO_URI}
