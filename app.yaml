# app.yaml
name: ai-medical-content-generator
region: nyc

services:
  - name: web
    github:
      repo: zainal89/ai-medical-content-generator
      branch: main
    run_command: python main.py
    environment_slug: python
    instance_size_slug: basic-xs
    http_port: 8080
    health_check:
      http_path: /health
      initial_delay_seconds: 120  # Increased from 30 to 60
      period_seconds: 10
      timeout_seconds: 10
      failure_threshold: 6
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}
      - key: PERPLEXITY_API_KEY
        scope: RUN_TIME
        value: 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
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        value: ${FIRECRAWL_API_KEY}
      - key: MONGO_URI
        scope: RUN_TIME
        value: ${MONGO_URI}

workers:
  - name: scheduler
    github:
      repo: zainal89/ai-medical-content-generator
      branch: main
    run_command: python worker.py
    environment_slug: python
    instance_size_slug: basic-xs
    instance_count: 1
    envs:
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        value: ${OPENAI_API_KEY}
      - key: FIRECRAWL_API_KEY
        scope: RUN_TIME
        value: ${FIRECRAWL_API_KEY}
      - key: MONGO_URI
        scope: RUN_TIME
        value: ${MONGO_URI}
